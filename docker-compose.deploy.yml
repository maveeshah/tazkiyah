services:
  tazkiyah-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tazkiyah-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: journald
      options:
        tag: "tazkiyah-api"
    env_file:
      - ./.env.prod
    networks:
      - web
      - platform
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.tazkiyah-api.rule=Host(`app.tazkiyah.co`) && PathPrefix(`/api`)
      - traefik.http.routers.tazkiyah-api.entrypoints=websecure
      - traefik.http.routers.tazkiyah-api.tls.certresolver=letsencrypt
      - traefik.http.routers.tazkiyah-api.priority=100
      - traefik.http.services.tazkiyah-api.loadbalancer.server.port=8000

  tazkiyah-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.deploy
    container_name: tazkiyah-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: journald
      options:
        tag: "tazkiyah-web"
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.tazkiyah-web.rule=Host(`app.tazkiyah.co`)
      - traefik.http.routers.tazkiyah-web.entrypoints=websecure
      - traefik.http.routers.tazkiyah-web.tls.certresolver=letsencrypt
      - traefik.http.routers.tazkiyah-web.priority=10
      - traefik.http.services.tazkiyah-web.loadbalancer.server.port=80

networks:
  web:
    external: true
  platform:
    external: true
